name: Build Superman ASI

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: powershell
        run: |
          Expand-Archive -Path "Superman-project.zip" -DestinationPath "project" -Force

      - name: Build Win32 ASI
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          cd project
          msbuild Superman.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      - name: Upload Superman.asi
        uses: actions/upload-artifact@v4
        with:
          name: Superman-GTA5-Legacy-3889
          path: project\build\Superman.asi
          if-no-files-found: error
